<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="RISLY Money Manager — aplikasi keuangan keluarga Rizki & Shelly. Catat transaksi, anggaran, kalender, catatan, dan laporan dalam satu PWA.">
  <meta name="theme-color" content="#F5F7FB">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RISLY">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="RISLY">

  <title>RISLY Money Manager</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="mask-icon" href="./icons/icon-maskable-512.png" color="#2563EB">

  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('risly.mm.prefs.v1') || '{}') || {};
        var dark = prefs.theme === 'dark' ||
          ((!prefs.theme || prefs.theme === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#08101E' : '#F5F7FB');
      } catch (error) { /* noop */ }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              200: '#BFDBFE',
              300: '#93C5FD',
              400: '#60A5FA',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
              800: '#1E40AF',
              900: '#1E3A8A',
            },
          },
          spacing: {
            '4.5': '1.125rem',
            '18': '4.5rem',
            'safe-bottom': 'env(safe-area-inset-bottom)',
          },
          boxShadow: {
            soft: '0 1px 2px rgba(15, 23, 42, .04), 0 12px 32px -20px rgba(15, 23, 42, .22)',
            lift: '0 20px 45px -22px rgba(15, 23, 42, .35)',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="./css/app.css">
</head>

<body class="h-full">
  <div id="app-splash" class="app-splash" role="status" aria-live="polite">
    <div class="app-splash-inner">
      <span class="brand-mark brand-mark-lg app-splash-mark">R</span>
      <p class="app-splash-name">RISLY</p>
      <p class="app-splash-tag">Keuangan keluarga, rapi bersahaja.</p>
      <span class="app-splash-loader" aria-hidden="true"><i></i></span>
    </div>
  </div>

  <div id="app-root" class="min-h-full"></div>
  <div id="modal-root" class="hidden" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript-card">
      <h1>JavaScript diperlukan</h1>
      <p>RISLY Money Manager berjalan sepenuhnya di browser. Aktifkan JavaScript untuk membuka aplikasi.</p>
    </div>
  </noscript>

  <!-- Libraries are requested with classic scripts so the app keeps working in Safari. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
