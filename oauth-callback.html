<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>Masuk Google · RISLY</title>
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 20% 15%, #dbeafe 0, transparent 55%),
                  radial-gradient(circle at 85% 10%, #e0e7ff 0, transparent 50%),
                  #f8fafc;
      color: #0f172a;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 24px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 24px 60px -24px rgba(15, 23, 42, .35);
    }
    .logo {
      width: 60px; height: 60px;
      border-radius: 18px;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 10px 24px -12px rgba(37, 99, 235, .6);
    }
    h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.02em; }
    p { margin: 0; font-size: 14px; line-height: 1.65; color: #475569; }
    .spinner {
      width: 30px; height: 30px;
      margin: 4px auto 18px;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-wrap {
      width: 52px; height: 52px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 700;
    }
    .ok { background: #dcfce7; color: #15803d; }
    .bad { background: #fee2e2; color: #b91c1c; }
    .actions { margin-top: 24px; display: grid; gap: 10px; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 14px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn.secondary { background: #eff6ff; color: #1d4ed8; }
    .email { font-weight: 600; color: #0f172a; word-break: break-all; }
    .hint { margin-top: 16px; font-size: 12px; color: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      .card { background: #1e293b; }
      p { color: #94a3b8; }
      .email { color: #e2e8f0; }
      .btn.secondary { background: #1e3a8a; color: #bfdbfe; }
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <img src="./icons/icon-192.png" alt="" class="logo">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Menyelesaikan masuk…</h1>
    <p id="message">Sebentar, akun Google Anda sedang dihubungkan dengan RISLY Money Manager.</p>
    <div class="actions" id="actions"></div>
    <p class="hint" id="hint">Jangan tutup jendela ini sampai proses selesai.</p>
  </main>

  <script type="module">
    import { completeGoogleRelayFromFragment } from './js/services/google-auth-relay.js';

    const spinner = document.getElementById('spinner');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const actions = document.getElementById('actions');
    const hint = document.getElementById('hint');

    function showSuccess(account) {
      spinner.remove();
      title.textContent = 'Berhasil masuk';
      message.innerHTML = `Akun <span class="email"></span> sudah terhubung.`;
      message.querySelector('.email').textContent = account.email;
      hint.textContent = 'Kembali ke aplikasi RISLY. Jendela ini boleh ditutup.';
      actions.innerHTML = `
        <a class="btn" href="./">Buka RISLY</a>
        <button class="btn secondary" type="button" id="close-window">Tutup jendela</button>`;
      document.getElementById('close-window')?.addEventListener('click', () => {
        window.close();
        // If the sheet refuses to close, send the user back to the app instead.
        setTimeout(() => { location.href = './'; }, 250);
      });
    }

    function showError(error) {
      spinner.remove();
      title.textContent = 'Belum berhasil';
      message.textContent = error?.message || 'Terjadi kesalahan saat masuk dengan Google.';
      hint.textContent = 'Tutup jendela ini lalu coba lagi dari aplikasi RISLY.';
      actions.innerHTML = `
        <a class="btn" href="./">Kembali ke RISLY</a>`;
      const badge = document.createElement('div');
      badge.className = 'icon-wrap bad';
      badge.textContent = '!';
      document.querySelector('.card').insertBefore(badge, title);
    }

    completeGoogleRelayFromFragment()
      .then((result) => {
        if (result?.error) showError(new Error(result.error));
        else if (result?.account) showSuccess(result.account);
        else showError(new Error('Hasil login tidak ditemukan.'));
      })
      .catch((error) => {
        console.error(error);
        showError(error);
      });
  </script>
</body>
</html>
