# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Quality gate: lint + unit test harus lolos sebelum deploy
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run unit tests (Vitest)
        run: npm test
      - name: Check version sync (config.js vs sw.js)
        run: npm run check:version

  # Smoke test E2E (Playwright) — memastikan alur utama tetap berjalan
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests
        # Sync test (tests/e2e/sync) butuh Firebase emulator, dijalankan terpisah.
        run: npx playwright test tests/e2e/smoke.test.js

  # Deploy hanya setelah quality dan E2E lolos
  deploy:
    needs: [quality, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Hanya file yang dipakai aplikasi; jangan ikut junk/, tools/, dan dokumen refactor
          path: |
            index.html
            css/
            js/
            icons/
            vendor/
            manifest.json
            sw.js
            privacy.html
            oauth-callback.html
            _headers
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
